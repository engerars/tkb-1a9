name: Register push device

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      subscription:
        description: "Push subscription JSON"
        required: true
        type: string

jobs:
  register:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[tkb-push]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Add subscription
        env:
          SUB: ${{ github.event.inputs.subscription || github.event.issue.body }}
        run: node tools/add-subscription.mjs
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/subscriptions.json
          git diff --cached --quiet || git commit -m "Register a reminder device"
          git push
      - name: Close issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment "Đã đăng ký thiết bị cho nhắc giờ học."
