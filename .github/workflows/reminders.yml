name: School time reminders

on:
  schedule:
    - cron: "*/15 22,23 * * 0-4"
    - cron: "*/15 0-10 * * 1-5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .reminders-sent.json
          key: reminders-sent-${{ github.run_id }}
          restore-keys: |
            reminders-sent-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install web-push
      - name: Send due reminders
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          LEAD_MINUTES: "20"
          WINDOW_MINUTES: "90"
        run: node tools/send-reminders.mjs
