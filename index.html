<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Thời khóa biểu lớp 1A9 – Tuyết Vũ, Trường Tiểu học số 2 Trương Quang Trọng, năm học 2026–2027"
    />
    <meta name="theme-color" content="#e56b93" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TKB 1A9" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Thời khóa biểu lớp 1A9 – Tuyết Vũ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Mali:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-theme="pink">
    <div class="bg" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>

    <header class="top">
      <div class="hero">
        <div class="hero-text">
          <h1>Thời khóa biểu</h1>
          <span class="ribbon">Lớp 1A9</span>
        </div>
        <button type="button" class="notify-btn" id="notifyOpen" aria-label="Nhắc giờ học">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0-6 6v3.2L4.4 15a1 1 0 0 0 .8 1.6h13.6a1 1 0 0 0 .8-1.6L18 12.2V9a6 6 0 0 0-6-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M9.5 16.6a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="now-wrap">
      <div class="now" id="nowBar" role="status" aria-live="polite"></div>
    </div>

    <nav class="tabs" id="tabNav" data-active="tkb" role="tablist" aria-label="Chế độ xem">
      <span class="tab-glider" aria-hidden="true"></span>
      <button
        class="tab is-active"
        role="tab"
        aria-selected="true"
        data-tab="tkb"
        id="tab-tkb"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M3 9h18M8 4v4M16 4v4" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect x="6.5" y="12" width="3" height="3" rx=".6" fill="currentColor" />
          <rect x="10.5" y="12" width="3" height="3" rx=".6" fill="currentColor" />
          <rect x="14.5" y="12" width="3" height="3" rx=".6" fill="currentColor" />
        </svg>
        Thời khóa biểu
      </button>
      <button class="tab" role="tab" aria-selected="false" data-tab="gio" id="tab-gio">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M12 9v4l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M9 4h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        Giờ ra vào lớp
      </button>
    </nav>

    <main>
      <section id="view-tkb" class="view" role="tabpanel" aria-labelledby="tab-tkb">
        <div class="day-bar" id="dayBar"></div>
        <div class="day-board" id="dayBoard"></div>
        <div class="week-board" id="weekBoard"></div>
        <button class="reset-btn" id="resetBtn" type="button">Khôi phục lịch ban đầu</button>
      </section>

      <section
        id="view-gio"
        class="view"
        role="tabpanel"
        aria-labelledby="tab-gio"
        hidden
      >
        <div class="bell-grid" id="bellGrid"></div>
      </section>
    </main>

    <footer class="foot">
      <p>Đúng giờ · Nề nếp tốt · Học tập hiệu quả</p>
    </footer>

    <div class="overlay" id="notifySheet" hidden>
      <div class="sheet notify-sheet" role="dialog" aria-modal="true" aria-labelledby="notifyTitle">
        <h2 id="notifyTitle">Nhắc đưa – đón đúng giờ</h2>
        <p class="editor-sub" id="notifyStatus"></p>
        <p class="ios-hint" id="notifyIos" hidden>
          iPhone: bấm <b>Chia sẻ</b> → <b>Thêm vào Màn hình chính</b>, rồi mở icon
          <b>TKB 1A9</b> và bật thông báo trong app.
        </p>
        <label class="switch-row">
          <span>Bật thông báo</span>
          <input id="notifyToggle" type="checkbox" />
        </label>
        <label class="custom-label" for="notifyLead">Nhắc trước</label>
        <select id="notifyLead">
          <option value="10">10 phút</option>
          <option value="15">15 phút</option>
          <option value="20" selected>20 phút</option>
          <option value="30">30 phút</option>
        </select>
        <label class="check-row"><input id="notifyDropoff" type="checkbox" checked /> Đưa đến trường</label>
        <label class="check-row"><input id="notifyStart" type="checkbox" checked /> Bắt đầu giờ học</label>
        <label class="check-row"><input id="notifyPickup" type="checkbox" checked /> Đón tan học</label>
        <p class="custom-label">Nhắc sắp tới hôm nay</p>
        <ul class="notify-next" id="notifyNext"></ul>
        <div class="editor-actions">
          <button type="button" id="notifyTest">Gửi thử</button>
          <button type="button" class="ghost" id="closeNotify">Đóng</button>
        </div>
        <button type="button" class="reset-btn" id="notifyCopy">Sao chép mã thiết bị (nhắc khi tắt app)</button>
      </div>
    </div>

    <div class="overlay" id="editor" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
        <h2 id="editorTitle">Đổi tiết học</h2>
        <p class="editor-sub" id="editorSub"></p>
        <div class="subject-grid" id="subjectGrid"></div>
        <label class="custom-label" for="customSubject">Môn khác</label>
        <div class="custom-row">
          <input id="customSubject" type="text" maxlength="40" placeholder="Nhập tên môn học" />
          <button type="button" id="saveCustom">Lưu</button>
        </div>
        <div class="editor-actions">
          <button type="button" class="ghost" id="clearPeriod">Để trống</button>
          <button type="button" class="ghost" id="closeEditor">Đóng</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/notify.js"></script>
  </body>
</html>
